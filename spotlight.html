<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COMA NOVA SPOTLIGHT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: #000;
  width: 100%; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
canvas { display: block; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
#hint {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.45); font-family: 'Courier New', monospace;
  font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
  pointer-events: none; transition: opacity 1s ease; white-space: nowrap;
}
#hint.hide { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">tap / drag to break</div>
<script>
(async () => {
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');

try { await document.fonts.load("900 16px 'Inter'"); } catch(_) {}
try { await document.fonts.load("400 16px 'Inter'"); } catch(_) {}
try { await document.fonts.load("300 16px 'Inter'"); } catch(_) {}

// ── Canvas sizing (16:9, fits screen) ───────────────────────────────────
const IW = 1920, IH = 1080;
let displayW = window.innerWidth;
let displayH = Math.round(displayW * IH / IW);
if (displayH > window.innerHeight) {
  displayH = window.innerHeight;
  displayW = Math.round(displayH * IW / IH);
}
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = displayW * DPR;
canvas.height = displayH * DPR;
canvas.style.width = displayW + 'px';
canvas.style.height = displayH + 'px';
const S = canvas.width / IW; // scale: canvas pixels per poster pixel

// ── Grid: 15 cols × 4 rows ───────────────────────────────────────────────
const COLS = 15, ROWS = 4;
const GAP = Math.round(IW * 0.0026); // ~5px @ 1920
const TW = (IW - (COLS + 1) * GAP) / COLS;
const TH = (IH - (ROWS + 1) * GAP) / ROWS;
const colR = [], rowR = [];
for (let c = 0; c < COLS; c++) {
  const x = Math.round(GAP + c * (TW + GAP));
  colR.push([x, Math.round(x + TW)]);
}
for (let r = 0; r < ROWS; r++) {
  const y = Math.round(GAP + r * (TH + GAP));
  rowR.push([y, Math.round(y + TH)]);
}
const avgTW = colR.reduce((s,[a,b]) => s + b - a, 0) / COLS;
const IMPACT_RADIUS = avgTW * 0.68;

// ── Poster canvas (revealed in Phase 2) ─────────────────────────────────
const frontC = document.createElement('canvas');
frontC.width = canvas.width;
frontC.height = canvas.height;
{
  const fc = frontC.getContext('2d');
  const W = frontC.width, H = frontC.height;
  fc.fillStyle = '#ffffff';
  fc.fillRect(0, 0, W, H);

  // thin black grid lines (tile gaps) — 병합된 타일(row0 cols2-4, row3 cols12-14)
  // 내부에는 구분선을 그리지 않는다.
  fc.fillStyle = '#000';
  const MERGE_SPANS = { 0: [2, 4], 3: [12, 14] };
  for (let r = 0; r < ROWS; r++) {
    const yTop = r === 0 ? 0 : Math.round(rowR[r-1][1] + (rowR[r][0] - rowR[r-1][1]) / 2);
    const yBot = r === ROWS - 1 ? IH : Math.round(rowR[r][1] + (rowR[r+1][0] - rowR[r][1]) / 2);
    const span = MERGE_SPANS[r];
    for (let c = 0; c <= COLS; c++) {
      if (span && c > span[0] && c <= span[1]) continue; // 병합 구간 내부 선 스킵
      const x = c === 0 ? 0 : (c === COLS ? IW : Math.round(colR[c-1][1] + (colR[c][0] - colR[c-1][1]) / 2));
      fc.fillRect(Math.round(x * S), Math.round(yTop * S), Math.round(GAP * S) || 1, Math.round((yBot - yTop) * S));
    }
  }
  for (let r = 0; r <= ROWS; r++) {
    const y = r === 0 ? 0 : (r === ROWS ? IH : Math.round(rowR[r-1][1] + (rowR[r][0] - rowR[r-1][1]) / 2));
    fc.fillRect(0, Math.round(y * S), W, Math.round(GAP * S) || 1);
  }

  // ── Big title: COMA / NOVA / SPOT / LIGHT ─────────────────────────────
  fc.fillStyle = '#000';
  fc.textAlign = 'center';
  fc.textBaseline = 'alphabetic';
  const titleCx = W * 0.500;
  const titleFs = H * 0.180;
  fc.font = `900 ${titleFs}px 'Inter', 'Arial Black', sans-serif`;
  fc.fillText('COMA',  titleCx, H * 0.289);
  fc.fillText('NOVA',  titleCx, H * 0.454);
  fc.fillText('SPOT',  titleCx, H * 0.700);
  fc.fillText('LIGHT', titleCx, H * 0.860);

  // ── Header row: THE  2ND  EDITION EXHIBITION ──────────────────────────
  fc.textAlign = 'left';
  fc.textBaseline = 'alphabetic';
  const hdrFs = H * 0.0275;
  fc.font = `800 ${hdrFs}px 'Inter', sans-serif`;
  fc.fillStyle = '#000';
  const hdrY = H * 0.0587;
  fc.fillText('THE', W * 0.028, hdrY);
  fc.fillText('2ND', W * 0.082, hdrY);
  const editionX = W * 0.150;
  fc.fillText('EDITION', editionX, hdrY);
  const editionW = fc.measureText('EDITION').width;
  fc.fillText('EXHIBITION', editionX + editionW + hdrFs * 0.9, hdrY);

  // ── Bottom-right merged tile: gallery info (오른쪽 정렬, 3줄) ───────────
  function fitToWidth(text, targetW, fs0, wt, fam) {
    fc.font = `${wt} ${fs0}px ${fam}`;
    const w0 = fc.measureText(text).width;
    const fs = fs0 * (targetW / w0);
    fc.font = `${wt} ${fs}px ${fam}`;
    return fs;
  }
  fc.textAlign = 'right';
  fc.fillStyle = '#111';
  const galFam = "'Inter', sans-serif";
  fitToWidth('Sejong art gallery', W * 0.1879, H * 0.045, '400', galFam);
  fc.fillText('Sejong art gallery', W * 0.9746, H * 0.82);
  fc.font = `400 ${H * 0.045}px ${galFam}`;
  fc.fillText('C&D Hall', W * 0.9746, H * 0.885);
  fitToWidth('2026.10.30 ——— 11.12', W * 0.2272, H * 0.037, '300', galFam);
  fc.fillText('2026.10.30 ——— 11.12', W * 0.9748, H * 0.95);
}

// ── Typewriter bg canvas (revealed in Phase 1) ───────────────────────────
const bgC = document.createElement('canvas');
bgC.width = canvas.width;
bgC.height = canvas.height;
const bgCtx = bgC.getContext('2d');

// ── Tile shape path (phone with notch) ──────────────────────────────────
function tilePath(c, ox, oy, dw, dh) {
  const sd = Math.min(dw, dh);
  const r = sd * 0.13;
  const nw = sd * 0.24;
  const nh = dh * 0.028;
  const nr = Math.min(nw * 0.35, nh * 0.45);
  const nx = ox + dw / 2;
  c.beginPath();
  c.moveTo(ox + r, oy);
  c.lineTo(nx - nw/2 - nr, oy);
  c.arcTo(nx - nw/2, oy, nx - nw/2, oy + nr, nr);
  c.lineTo(nx - nw/2, oy + nh - nr);
  c.arcTo(nx - nw/2, oy + nh, nx - nw/2 + nr, oy + nh, nr);
  c.lineTo(nx + nw/2 - nr, oy + nh);
  c.arcTo(nx + nw/2, oy + nh, nx + nw/2, oy + nh - nr, nr);
  c.lineTo(nx + nw/2, oy + nr);
  c.arcTo(nx + nw/2, oy, nx + nw/2 + nr, oy, nr);
  c.lineTo(ox + dw - r, oy);
  c.arcTo(ox + dw, oy, ox + dw, oy + r, r);
  c.lineTo(ox + dw, oy + dh - r);
  c.arcTo(ox + dw, oy + dh, ox + dw - r, oy + dh, r);
  c.lineTo(ox + r, oy + dh);
  c.arcTo(ox, oy + dh, ox, oy + dh - r, r);
  c.lineTo(ox, oy + r);
  c.arcTo(ox, oy, ox + r, oy, r);
  c.closePath();
}

// ── Tile object factory ──────────────────────────────────────────────────
function makeTile(r, c) {
  const [x1,x2] = colR[c], [y1,y2] = rowR[r];
  return {
    ix:x1, iy:y1, iw:x2-x1, ih:y2-y1, row:r, col:c,
    phase:'idle', hitCount:0,
    delay:0, willBlink:false, willVanish:false,
    blinkT:0, blinkCycle:0, blinkOn:true,
    resting:false,
    physX:0, physY:0, physVX:0, physVY:0,
    physAngle:0, physOmega:0,
    initVX:0, initVY:0, initOmega:0,
    spawnGroup:-1, fallAge:0, hasSounded:false,
  };
}
function createTileArray() {
  const arr = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      arr.push(makeTile(r, c));
  const MERGES = [
    { row:0, cols:[2,3,4] },
    { row:3, cols:[12,13,14] },
  ];
  for (const g of MERGES) {
    const ms = arr.filter(t => t.row === g.row && g.cols.includes(t.col));
    if (ms.length < 2) continue;
    const ix = Math.min(...ms.map(t => t.ix));
    const iy = Math.min(...ms.map(t => t.iy));
    const ix2 = Math.max(...ms.map(t => t.ix + t.iw));
    const iy2 = Math.max(...ms.map(t => t.iy + t.ih));
    ms.forEach(m => arr.splice(arr.indexOf(m), 1));
    arr.push({
      ix, iy, iw:ix2-ix, ih:iy2-iy, row:g.row, col:g.cols[0],
      merged:true,
      phase:'idle', hitCount:0,
      delay:0, willBlink:false, willVanish:false,
      blinkT:0, blinkCycle:0, blinkOn:true,
      resting:false,
      physX:0, physY:0, physVX:0, physVY:0,
      physAngle:0, physOmega:0,
      initVX:0, initVY:0, initOmega:0,
      spawnGroup:-1, fallAge:0, hasSounded:false,
    });
  }
  return arr;
}
const tiles = createTileArray();
const blackTiles = createTileArray();

// ── Draw white tile ──────────────────────────────────────────────────────
function drawWhiteTile(t, ox, oy) {
  const dw = t.iw * S, dh = t.ih * S;
  ctx.save();
  tilePath(ctx, ox, oy, dw, dh);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.clip();
  ctx.drawImage(frontC, t.ix * S, t.iy * S, t.iw * S, t.ih * S, ox, oy, dw, dh);
  ctx.restore();
}

// ── Draw black tile ──────────────────────────────────────────────────────
function drawBlackTile(t, ox, oy) {
  const dw = t.iw * S, dh = t.ih * S;
  ctx.save();
  tilePath(ctx, ox, oy, dw, dh);
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.restore();
}

// ── Physics ──────────────────────────────────────────────────────────────
const GRAVITY = 1400, REST_TILE = 0.10, ITERS = 32, MAX_SPD = 1500;
const SLOP = 0.5, SUPP = 4;
function hw(t) { return t.iw * S * 0.5; }
function hh(t) { return t.ih * S * 0.5; }
function aabb(ax,ay,ahw,ahh,bx,by,bhw,bhh) {
  const dx=ax-bx,dy=ay-by,ox=ahw+bhw-Math.abs(dx);
  if(ox<=0) return null;
  const oy=ahh+bhh-Math.abs(dy);
  if(oy<=0) return null;
  return ox<oy?{depth:ox,nx:dx<0?-1:1,ny:0}:{depth:oy,nx:0,ny:dy<0?-1:1};
}
function aabbNear(ax,ay,ahw,ahh,bx,by,bhw,bhh) {
  return aabb(ax,ay,ahw+SUPP,ahh+SUPP,bx,by,bhw,bhh)!=null;
}
function pushOut(t,obs) {
  const c=aabb(t.physX,t.physY,hw(t),hh(t),obs.cx,obs.cy,obs.hw,obs.hh);
  if(c){t.physX+=c.nx*c.depth;t.physY+=c.ny*c.depth;}
}
function buildObs(live,all) {
  return [
    ...all.filter(t=>t.phase==='idle'||t.phase==='waiting'||t.phase==='blinking')
      .map(o=>({cx:(o.ix+o.iw*.5)*S,cy:(o.iy+o.ih*.5)*S,hw:hw(o),hh:hh(o),src:null})),
    ...live.filter(t=>t.resting)
      .map(t=>({cx:t.physX,cy:t.physY,hw:hw(t),hh:hh(t),src:t})),
  ];
}
function startFalling(t) {
  t.phase='falling';
  t.physX=(t.ix+t.iw*.5)*S; t.physY=(t.iy+t.ih*.5)*S;
  t.physVX=t.initVX; t.physVY=t.initVY;
  t.physAngle=0; t.physOmega=t.initOmega; t.fallAge=0;
}

// ── Impact sound (Web Audio, synthesized — no external files) ────────────
let audioCtx = null;
function ensureAudio() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(_) {}
}
function playClack(intensity) {
  if (!audioCtx) return;
  intensity = Math.max(0, Math.min(1, intensity));
  const now = audioCtx.currentTime;
  const vol = 0.06 + intensity * 0.20;
  const baseFreq = 340 + intensity * 130 + Math.random() * 45;

  const partials = [
    { ratio: 1,    amp: 1,    decay: 0.075 },
    { ratio: 2.4,  amp: 0.14, decay: 0.025 },
  ];
  partials.forEach(p => {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = baseFreq * p.ratio;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(vol * p.amp, now + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0008, now + p.decay + intensity * 0.015);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + p.decay + 0.06);
  });
}
let soundBudgetThisFrame = 0;
const MAX_SOUNDS_PER_FRAME = 3;
const IMPACT_MIN_SPD = 55 * S, IMPACT_MAX_SPD = 650 * S;
function triggerImpactSound(speed, ...involved) {
  if (speed < IMPACT_MIN_SPD || soundBudgetThisFrame >= MAX_SOUNDS_PER_FRAME || !audioCtx) return;
  if (involved.every(t => t.hasSounded)) return;
  soundBudgetThisFrame++;
  involved.forEach(t => { t.hasSounded = true; });
  playClack((speed - IMPACT_MIN_SPD) / (IMPACT_MAX_SPD - IMPACT_MIN_SPD));
}

// ── Ambient machine crackle (검은 타일이 화면에 남아있는 동안만 재생) ──────
let ambientSrc = null, ambientFilter1 = null, ambientFilter2 = null, ambientGain = null, ambientReady = false;
function ensureAmbient() {
  if (!audioCtx || ambientReady) return;
  ambientReady = true;
  const len = audioCtx.sampleRate * 2;
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  ambientSrc = audioCtx.createBufferSource();
  ambientSrc.buffer = buf; ambientSrc.loop = true;

  ambientFilter1 = audioCtx.createBiquadFilter();
  ambientFilter1.type = 'bandpass'; ambientFilter1.frequency.value = 2400; ambientFilter1.Q.value = 0.5;
  const g1 = audioCtx.createGain(); g1.gain.value = 0.65;

  ambientFilter2 = audioCtx.createBiquadFilter();
  ambientFilter2.type = 'bandpass'; ambientFilter2.frequency.value = 750; ambientFilter2.Q.value = 1.4;
  const g2 = audioCtx.createGain(); g2.gain.value = 0.55;

  ambientGain = audioCtx.createGain();
  ambientGain.gain.value = 0;

  ambientSrc.connect(ambientFilter1); ambientFilter1.connect(g1); g1.connect(ambientGain);
  ambientSrc.connect(ambientFilter2); ambientFilter2.connect(g2); g2.connect(ambientGain);
  ambientGain.connect(audioCtx.destination);
  ambientSrc.start();

  setInterval(() => {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    ambientFilter1.frequency.setTargetAtTime(1700 + Math.random() * 1600, t, 0.5);
    ambientFilter2.frequency.setTargetAtTime(500 + Math.random() * 600, t, 0.6);
  }, 850);
}
function playAmbientCrackleTick(vol) {
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'square';
  osc.frequency.value = 1800 + Math.random() * 2600;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.0004, now + 0.006 + Math.random() * 0.01);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.02);
}
function playBeepBeep(vol) {
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = 880;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(vol, now + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0004, now + 0.15);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.17);
}
let lastAmbientCrackleT = -999;
let lastBeepPairT = -999;
function updateAmbient(visibleCount, totalCount) {
  if (!audioCtx) return;
  ensureAmbient();
  const frac = totalCount > 0 ? Math.min(1, visibleCount / totalCount) : 0;
  const targetGain = frac > 0 ? 0.006 + frac * 0.022 : 0;
  ambientGain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.2);
  if (frac > 0) {
    const now = audioCtx.currentTime;
    const gap = 1.1 - frac * 0.55;
    if (now - lastAmbientCrackleT > gap) {
      lastAmbientCrackleT = now;
      playAmbientCrackleTick(0.012 + frac * 0.03);
    }
    if (now - lastBeepPairT > 3.0) {
      lastBeepPairT = now;
      playBeepBeep(0.03 + frac * 0.03);
    }
  }
}
function silenceAmbient() {
  if (!audioCtx || !ambientGain) return;
  ambientGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2);
}

function stepPhysics(falling, all, dt) {
  soundBudgetThisFrame = 0;
  const live = falling.filter(t=>t.phase!=='gone');
  const fixedObs = all.filter(t=>t.phase==='idle'||t.phase==='waiting'||t.phase==='blinking')
    .map(o=>({cx:(o.ix+o.iw*.5)*S,cy:(o.iy+o.ih*.5)*S,hw:hw(o),hh:hh(o)}));
  for (const t of live) {
    if (!t.resting) continue;
    if (!fixedObs.some(obs=>aabbNear(t.physX,t.physY,hw(t),hh(t),obs.cx,obs.cy,obs.hw,obs.hh)))
      t.resting=false;
  }
  const obs = buildObs(live, all);
  const active = live.filter(t=>!t.resting);
  for (const t of active) {
    t.fallAge=(t.fallAge||0)+dt;
    t.physVY+=GRAVITY*dt;
    t.physX+=t.physVX*dt; t.physY+=t.physVY*dt;
    t.physAngle+=t.physOmega*dt;
    t.physOmega*=Math.exp(-9*dt);
    const spd=Math.hypot(t.physVX,t.physVY);
    if(spd>MAX_SPD){t.physVX*=MAX_SPD/spd;t.physVY*=MAX_SPD/spd;}
  }
  for (const t of active)
    if (t.physY-Math.max(hw(t),hh(t))>canvas.height) t.phase='gone';
  const alive=active.filter(t=>t.phase!=='gone');
  for (let it=0;it<ITERS;it++) {
    for (const t of alive) {
      if(t.physX-hw(t)<0){t.physX=hw(t);if(t.physVX<0)t.physVX*=-0.08;}
      if(t.physX+hw(t)>canvas.width){t.physX=canvas.width-hw(t);if(t.physVX>0)t.physVX*=-0.08;}
    }
    for (let i=0;i<alive.length;i++) for (let j=i+1;j<alive.length;j++) {
      const a=alive[i],b=alive[j];
      if(a.spawnGroup>=0&&a.spawnGroup===b.spawnGroup&&(a.fallAge||0)<0.3&&(b.fallAge||0)<0.3) continue;
      const c=aabb(a.physX,a.physY,hw(a),hh(a),b.physX,b.physY,hw(b),hh(b));
      if(!c) continue;
      const p=(c.depth+SLOP)*.5;
      a.physX+=c.nx*p; a.physY+=c.ny*p; b.physX-=c.nx*p; b.physY-=c.ny*p;
      const rv=(a.physVX-b.physVX)*c.nx+(a.physVY-b.physVY)*c.ny;
      if(rv<0){
        const i=-(1+REST_TILE)*rv*.5;a.physVX+=i*c.nx;a.physVY+=i*c.ny;b.physVX-=i*c.nx;b.physVY-=i*c.ny;
        if (it===0) triggerImpactSound(-rv, a, b);
      }
    }
    for (const t of alive) for (const ob of obs) {
      const c=aabb(t.physX,t.physY,hw(t),hh(t),ob.cx,ob.cy,ob.hw,ob.hh);
      if(!c) continue;
      t.physX+=c.nx*(c.depth+SLOP); t.physY+=c.ny*(c.depth+SLOP);
      const rv=t.physVX*c.nx+t.physVY*c.ny;
      if(rv<0){
        t.physVX-=rv*c.nx*(1+REST_TILE);t.physVY-=rv*c.ny*(1+REST_TILE);
        if (it===0) triggerImpactSound(-rv, t);
      }
    }
  }
  for (const t of alive) {
    const s2=t.physVX**2+t.physVY**2;
    if(s2<9){t.physVX=0;t.physVY=0;}else if(s2<100){t.physVX*=0.85;t.physVY*=0.85;}else if(s2<400){t.physVX*=0.93;t.physVY*=0.93;}
  }
  const sorted=[...alive].sort((a,b)=>b.physY-a.physY);
  for (let pass=0;pass<4;pass++) {
    let any=false;
    const cur=buildObs(live,all);
    for (const t of sorted) {
      if(t.resting) continue;
      if(t.physVX**2+t.physVY**2>1600) continue;
      if(!cur.some(ob=>aabb(t.physX,t.physY,hw(t),hh(t),ob.cx,ob.cy,ob.hw,ob.hh))) continue;
      t.physVX=0;t.physVY=0;t.physOmega=0;t.physAngle=0;
      cur.forEach(ob=>pushOut(t,ob));
      t.resting=true;
      cur.push({cx:t.physX,cy:t.physY,hw:hw(t),hh:hh(t),src:t});
      any=true;
    }
    if(!any) break;
  }
}

// ── Typewriter animation ─────────────────────────────────────────────────
const G = '#7bcc58';
const LINES = [
  [0.026, 0.052, 'This exhibition does not discuss digital moderation. Nor does it tell you to break bad habits.'],
  [0.100, 0.082, ' It simply asks one question'],
  [0.026, 0.112, 'Have you ever faced your digital behavior in the form of data, even once?'],
  [0.026, 0.142, 'People believe they handle digital devices consciously.'],
  [0.026, 0.172, 'However, in reality,'],
  [0.026, 0.199, ' we react automatically, caught between algorithmic design and muscle memory.'],
  [0.026, 0.259, [{text:'COMA NOVA ', color:G}, {text:'directly demonstrates this gap through visualized data.'}]],
  [0.083, 0.289, ' You intended to look at your smartphone for just a moment,'],
  [0.083, 0.319, ' but an hour has passed;'],
  [0.542, 0.352, 'you cannot remember why you'],
  [0.542, 0.382, 'turned it on, and ultimately, you failed'],
  [0.542, 0.412, 'to accomplish what you intended to do.'],
  [0.542, 0.448, 'This is not just your story'],
  [0.124, 0.508, [{text:' COMA NOVA ', color:G}, {text:'is an exhibition that bridges the traces you leave'}]],
  [0.124, 0.538, ' behind with the self you were unaware of.'],
  [0.124, 0.568, ' How many times did you try to stop today? You intended'],
  [0.124, 0.598, ' to look at your smartphone for a moment,'],
  [0.026, 0.667, [{text:'[ COMA NOVA ] ', color:G}, {text:'is an exhibition that bridges the gap between'}]],
  [0.124, 0.697, ' the traces you leave behind and the self you are unaware of.'],
];
function lineLen(l) {
  const t=l[2];
  return typeof t==='string'?t.length:t.reduce((s,p)=>s+p.text.length,0);
}
const TOTAL_CHARS = LINES.reduce((s,l)=>s+lineLen(l),0);
const CPS=55, HOLD=1.2, PAUSE=0.4;
const ba={state:'typing',charPos:0,timer:0};
function advanceBa(dt) {
  if(ba.state==='typing'){
    ba.charPos+=CPS*dt;
    if(ba.charPos>=TOTAL_CHARS){ba.charPos=TOTAL_CHARS;ba.state='hold';ba.timer=HOLD;}
  } else if(ba.state==='hold'){
    ba.timer-=dt; if(ba.timer<=0) ba.state='clear';
  } else if(ba.state==='clear'){
    ba.charPos=0; ba.state='pause'; ba.timer=PAUSE;
  } else {
    ba.timer-=dt; if(ba.timer<=0) ba.state='typing';
  }
}
function renderBa(tc, tw, th) {
  tc.fillStyle='#000'; tc.fillRect(0,0,tw,th);
  if(ba.state!=='typing'&&ba.state!=='hold') return;
  const fs=Math.round(th*0.020);
  tc.font=`${fs}px 'Courier New',monospace`;
  tc.textBaseline='top';
  let rem=Math.floor(ba.charPos);
  for (const [xr,yr,tp] of LINES) {
    if(rem<=0) break;
    let lx=xr*tw;
    if(typeof tp==='string'){
      tc.fillStyle='rgba(255,255,255,0.82)';
      tc.fillText(tp.slice(0,rem),lx,yr*th);
      rem-=tp.length;
    } else {
      for (const p of tp) {
        if(rem<=0) break;
        tc.fillStyle=p.color||'rgba(255,255,255,0.82)';
        tc.fillText(p.text.slice(0,rem),lx,yr*th);
        lx+=tc.measureText(p.text).width;
        rem-=p.text.length;
      }
    }
  }
}

// ── State machine for tiles ──────────────────────────────────────────────
const BLINK_IV = 0.40;
function updateTile(t, dt, falling) {
  if(t.phase==='waiting'){
    t.delay-=dt;
    if(t.delay<=0){
      if(t.willBlink){t.phase='blinking';t.blinkT=0;t.blinkCycle=0;t.blinkOn=true;}
      else startFalling(t);
    }
  }
  if(t.phase==='blinking'){
    t.blinkT+=dt;
    if(t.blinkT>=BLINK_IV){
      t.blinkT-=BLINK_IV; t.blinkOn=!t.blinkOn;
      if(!t.blinkOn) t.blinkCycle++;
      else if(t.blinkCycle>=1){
        if(t.willVanish) t.phase='gone'; else startFalling(t);
      }
    }
  }
  if(t.phase==='falling') falling.push(t);
}

// ── Game state ───────────────────────────────────────────────────────────
let phase=1, interacted=false, blackInteracted=false, impLv=0, grpCtr=0;
let appMode='normal', phase2Count=0, popupRects=[];
function resetArr(arr) {
  for(const t of arr){
    t.phase='idle';t.hitCount=0;t.delay=0;t.willBlink=false;t.willVanish=false;
    t.blinkT=0;t.blinkCycle=0;t.blinkOn=true;t.resting=false;
    t.physX=0;t.physY=0;t.physVX=0;t.physVY=0;
    t.physAngle=0;t.physOmega=0;t.initVX=0;t.initVY=0;t.initOmega=0;
    t.spawnGroup=-1;t.fallAge=0;t.hasSounded=false;
  }
}
function toPhase2(){
  resetArr(blackTiles);blackInteracted=false;impLv=0;phase=2;
  phase2Count++;
  if (phase2Count >= 2) { appMode='popup'; silenceAmbient(); hint.classList.add('hide'); }
}
function toPhase1(){resetArr(tiles);interacted=false;impLv=0;hint.classList.remove('hide');phase=1;}
function restartLoop(){
  appMode='normal'; phase2Count=0; popupRects=[];
  resetArr(tiles); resetArr(blackTiles);
  interacted=false; blackInteracted=false; impLv=0; phase=1;
  hint.classList.remove('hide');
}

// ── Popup: "Do you want to emerge from the digital coma?" ────────────────
function drawPopup() {
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, w, h);

  const boxW = w * 0.3, boxH = h * 0.23;
  const bx = (w - boxW) / 2, by = (h - boxH) / 2;
  const fam = "'Courier New', monospace";

  ctx.fillStyle = '#000';
  ctx.fillRect(bx, by, boxW, boxH);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = Math.max(1, h * 0.0016);
  const inset = h * 0.004;
  ctx.strokeRect(bx, by, boxW, boxH);
  ctx.strokeRect(bx + inset, by + inset, boxW - inset * 2, boxH - inset * 2);

  const padX = boxW * 0.07;
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  const qFs = h * 0.015;
  ctx.font = `${qFs}px ${fam}`;
  ctx.fillText('Do you want to emerge from the digital coma?', bx + padX, by + boxH * 0.24);

  const optFs = h * 0.016;
  ctx.font = `${optFs}px ${fam}`;
  const options = [
    { label: 'Agree.', action: 'agree' },
    { label: 'Generate.', action: 'restart' },
    { label: "NO. I don\u2019t.", action: 'restart' },
  ];
  const rowGap = boxH * 0.185;
  let rowY = by + boxH * 0.44;
  popupRects = [];
  options.forEach(opt => {
    ctx.fillText('\u25B6', bx + padX, rowY);
    ctx.fillText(opt.label, bx + padX + optFs * 1.5, rowY);
    popupRects.push({
      x: bx + padX * 0.5, y: rowY - optFs * 1.05,
      w: boxW - padX, h: optFs * 1.5,
      action: opt.action,
    });
    rowY += rowGap;
  });
}

// ── Awakened screen (shown after "Agree.") ────────────────────────────────
function drawAwakened() {
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `${h * 0.02}px 'Courier New', monospace`;
  ctx.fillText('Congratulations. You have awoken from the digital coma.', w / 2, h / 2);
}


let lastTs=null;
function render(ts) {
  if(lastTs===null) lastTs=ts;
  const dt=Math.min((ts-lastTs)/1000,0.05); lastTs=ts;
  if (appMode==='awakened') {
    drawAwakened();
    if (hoverTop || slideProgress > 0) drawExitAffordance(dt);
    requestAnimationFrame(render); return;
  }
  ctx.clearRect(0,0,canvas.width,canvas.height);
  advanceBa(dt);
  if(phase===1) {
    renderBa(ctx, canvas.width, canvas.height);
    const falling=[];
    for(const t of tiles){
      updateTile(t,dt,falling);
      const dx=t.ix*S, dy=t.iy*S;
      if(t.phase==='idle'||t.phase==='waiting') drawWhiteTile(t,dx,dy);
      else if(t.phase==='blinking'&&t.blinkOn) drawWhiteTile(t,dx,dy);
      else if(t.phase==='falling'){
        ctx.save();ctx.translate(t.physX,t.physY);ctx.rotate(t.physAngle);
        drawWhiteTile(t,-t.iw*S*.5,-t.ih*S*.5);ctx.restore();
      }
    }
    stepPhysics(falling,tiles,dt);
    if(interacted&&tiles.every(t=>t.phase==='gone'||t.phase==='falling')) toPhase2();
    const blackExposed = tiles.filter(t=>t.phase==='gone'||t.phase==='falling'||(t.phase==='blinking'&&!t.blinkOn)).length;
    updateAmbient(blackExposed, tiles.length);
  } else {
    renderBa(bgCtx, bgC.width, bgC.height);
    ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
    for(const t of blackTiles){
      if(t.phase!=='gone') continue;
      const dx=t.ix*S,dy=t.iy*S,dw=t.iw*S,dh=t.ih*S;
      ctx.save(); tilePath(ctx,dx,dy,dw,dh); ctx.clip();
      ctx.drawImage(frontC, dx,dy,dw,dh, dx,dy,dw,dh);
      ctx.restore();
    }
    const falling=[];
    for(const t of blackTiles){
      updateTile(t,dt,falling);
      if(t.phase==='gone') continue;
      const dx=t.ix*S,dy=t.iy*S,dw=t.iw*S,dh=t.ih*S;
      const ocx=(t.ix+t.iw*.5)*S, ocy=(t.iy+t.ih*.5)*S;
      if(t.phase==='idle'||t.phase==='waiting'){
        ctx.save(); tilePath(ctx,dx,dy,dw,dh); ctx.clip(); ctx.drawImage(bgC,0,0); ctx.restore();
      } else if(t.phase==='blinking'&&t.blinkOn){
        ctx.save(); tilePath(ctx,dx,dy,dw,dh); ctx.clip(); ctx.drawImage(bgC,0,0); ctx.restore();
      } else if(t.phase==='falling'){
        ctx.save(); ctx.translate(t.physX,t.physY); ctx.rotate(t.physAngle);
        tilePath(ctx,-dw*.5,-dh*.5,dw,dh); ctx.clip();
        ctx.drawImage(bgC,-ocx,-ocy); ctx.restore();
      }
    }
    stepPhysics(falling,blackTiles,dt);
    if (appMode==='normal') {
      if(blackInteracted&&blackTiles.every(t=>t.phase==='gone'||t.phase==='falling')) toPhase1();
      const visibleBlackCount = blackTiles.filter(t=>t.phase!=='gone').length;
      updateAmbient(visibleBlackCount, blackTiles.length);
    }
  }
  if (appMode==='popup') drawPopup();
  if (hoverTop || slideProgress > 0) drawExitAffordance(dt);
  requestAnimationFrame(render);
}

// ── Interaction ──────────────────────────────────────────────────────────
const WAVE_SPD = IW * 0.13;
function firstInteract(ipx, ipy, arr) {
  const el=arr.filter(t=>t.phase==='idle')
    .map(t=>({t,d:Math.hypot(t.ix+t.iw/2-ipx,t.iy+t.ih/2-ipy)}))
    .sort((a,b)=>a.d-b.d);
  const picked=[],cols=new Set();
  for(const{t,d} of el){
    if(cols.has(t.col)) continue;
    picked.push({t,d}); cols.add(t.col);
    if(picked.length>=3) break;
  }
  picked.forEach(({t,d})=>{t.delay=d/WAVE_SPD;t.phase='waiting';t.willBlink=true;t.willVanish=true;});
}
function impact(ipx, ipy, arr) {
  const multi=Math.min(Math.pow(1.5,impLv),4);
  impLv++;
  const grp=++grpCtr;
  const effR=IMPACT_RADIUS*multi, pushR=effR*S*3;
  for(const t of arr){
    if(t.phase!=='idle') continue;
    const nx=Math.max(t.ix,Math.min(t.ix+t.iw,ipx));
    const ny=Math.max(t.iy,Math.min(t.iy+t.ih,ipy));
    if(Math.hypot(nx-ipx,ny-ipy)>effR) continue;
    const ddx=t.ix+t.iw*.5-ipx, ddy=t.iy+t.ih*.5-ipy;
    const str=1-Math.hypot(nx-ipx,ny-ipy)/effR;
    const spd=(473+Math.random()*338)*S*(0.4+str*0.6)*multi;
    const ang=Math.atan2(ddy||.001,ddx)+(Math.random()-.5)*.6;
    t.phase='waiting'; t.delay=Math.hypot(ddx,ddy)/WAVE_SPD;
    t.willBlink=false; t.willVanish=false; t.spawnGroup=grp;
    t.initVX=Math.cos(ang)*spd*.72; t.initVY=Math.sin(ang)*spd*.65-spd*.12;
    t.initOmega=(Math.random()-.5)*.8;
  }
  for(const t of arr){
    if(t.phase!=='falling') continue;
    const dx=t.physX-ipx*S, dy=t.physY-ipy*S, d=Math.hypot(dx,dy);
    if(d>pushR) continue;
    const fo=1-d/pushR, mn=hw(t)*.4;
    const ex=d<mn?(Math.random()-.5)*2:dx/d, ey=d<mn?-.6:dy/d;
    const el=Math.hypot(ex,ey)||1;
    const push=2200*S*fo*multi;
    t.resting=false; t.physVX+=ex/el*push; t.physVY+=ey/el*push-push*.4;
    t.physOmega+=(Math.random()-.5)*1.2*fo;
  }
}
function onInput(cx, cy) {
  const ipx=cx/S, ipy=cy/S;
  if(phase===1){
    if(!interacted){interacted=true;hint.classList.add('hide');firstInteract(ipx,ipy,tiles);}
    else impact(ipx,ipy,tiles);
  } else {
    if(!blackInteracted){blackInteracted=true;firstInteract(ipx,ipy,blackTiles);}
    else impact(ipx,ipy,blackTiles);
  }
}

// ── Pointer / drag handling ────────────────────────────────────────────
function pointerXY(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return [(clientX-r.left)*(canvas.width/r.width), (clientY-r.top)*(canvas.height/r.height)];
}
let dragging = false;
let lastDragX = null, lastDragY = null;
const DRAG_STEP = avgTW * S * 0.45;

function dragTrigger(cx, cy) {
  if (lastDragX === null) {
    onInput(cx, cy);
  } else {
    const d = Math.hypot(cx-lastDragX, cy-lastDragY);
    if (d < DRAG_STEP) return;
    onInput(cx, cy);
  }
  lastDragX = cx; lastDragY = cy;
}

function handleOverlayClick(cx, cy) {
  if (exitBtnRect && cx>=exitBtnRect.x && cx<=exitBtnRect.x+exitBtnRect.w && cy>=exitBtnRect.y && cy<=exitBtnRect.y+exitBtnRect.h) {
    handleExitClick();
    return true;
  }
  if (appMode === 'popup') {
    for (const r of popupRects) {
      if (cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h) {
        if (r.action === 'agree') { appMode = 'awakened'; silenceAmbient(); }
        else { restartLoop(); }
        return true;
      }
    }
    return true;
  }
  if (appMode === 'awakened') return true;
  return false;
}

// ── 상단 호버 시 나가기(X) 버튼 ────────────────────────────────────────────
let hoverTop = false, exitBtnRect = null, slideProgress = 0;
function handleExitClick() {
  console.log('[exit] 나가기 클릭됨 — 연결할 화면 추후 결정');
}
window.addEventListener('mousemove', e => {
  const [, cy] = pointerXY(e.clientX, e.clientY);
  hoverTop = cy < canvas.height * 0.03;
});
window.addEventListener('mouseleave', () => { hoverTop = false; });
function drawExitAffordance(dt) {
  const target = hoverTop ? 1 : 0;
  const speed = 1 / 0.28;
  if (slideProgress < target) slideProgress = Math.min(target, slideProgress + dt*speed);
  else if (slideProgress > target) slideProgress = Math.max(target, slideProgress - dt*speed);
  if (slideProgress <= 0.001) { exitBtnRect = null; return; }

  const w = canvas.width, h = canvas.height;
  const ease = 1 - Math.pow(1 - slideProgress, 3);
  ctx.save();
  const maxDimH = h * 0.20;
  const revealH = maxDimH * ease;
  const grad = ctx.createLinearGradient(0, 0, 0, maxDimH);
  grad.addColorStop(0, 'rgba(0,0,0,0.28)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, revealH);

  const size = h * 0.068;
  const pad = h * 0.028;
  const cx0 = w - pad - size/2, cy0 = pad + size/2;
  ctx.globalAlpha = slideProgress;
  ctx.lineCap = 'round';
  const r = size*0.32;
  const mainW = Math.max(3, h*0.007);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = mainW + Math.max(2, h*0.005);
  ctx.beginPath(); ctx.moveTo(cx0-r,cy0-r); ctx.lineTo(cx0+r,cy0+r); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx0+r,cy0-r); ctx.lineTo(cx0-r,cy0+r); ctx.stroke();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = mainW;
  ctx.beginPath(); ctx.moveTo(cx0-r,cy0-r); ctx.lineTo(cx0+r,cy0+r); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx0+r,cy0-r); ctx.lineTo(cx0-r,cy0+r); ctx.stroke();
  ctx.restore();
  exitBtnRect = slideProgress > 0.5 ? { x: cx0-size*0.75, y: cy0-size*0.75, w: size*1.5, h: size*1.5 } : null;
}

canvas.addEventListener('mousedown', e => {
  ensureAudio();
  const [cx, cy] = pointerXY(e.clientX, e.clientY);
  if (handleOverlayClick(cx, cy)) return;
  dragging = true; lastDragX = null; lastDragY = null;
  dragTrigger(cx, cy);
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const [cx, cy] = pointerXY(e.clientX, e.clientY);
  dragTrigger(cx, cy);
});
window.addEventListener('mouseup', () => { dragging = false; lastDragX = null; lastDragY = null; });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  ensureAudio();
  const t = e.touches[0];
  const [cx, cy] = pointerXY(t.clientX, t.clientY);
  if (handleOverlayClick(cx, cy)) return;
  dragging = true; lastDragX = null; lastDragY = null;
  dragTrigger(cx, cy);
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!dragging) return;
  const t = e.touches[0];
  const [cx, cy] = pointerXY(t.clientX, t.clientY);
  dragTrigger(cx, cy);
}, {passive:false});
canvas.addEventListener('touchend', () => { dragging = false; lastDragX = null; lastDragY = null; });

requestAnimationFrame(ts => { lastTs=ts; render(ts); });
})();
</script>
